# ============================================================
# K-9 Multi-Chain Network Ledger
# Separates EVM execution layer from Cosmos surveillance layer.
# No raw secrets here — only addresses (public) + vault references.
# Real keys live in .env / Base44 secrets, never in this file.
# ============================================================

project_footprint: "AEG-K9-Unified"

networks:
  evm_execution_layer:
    chain_name: "base-sepolia"
    chain_id: 84532
    role: "AEG protocol deploy target — SessionKeyWallet, ProofOfRationalityVerifier"
    rpc_endpoint_env: "BASE_SEPOLIA_RPC"          # resolved from .env
    verification_api: "https://api-sepolia.basescan.org/api"
    status: "ACTIVE — AEG-4 pending deploy, AEG-6 scaffolded"

  cosmos_surveillance_layer:
    chain_name: "tx-mainnet"
    chain_id: "coreum-mainnet-1"     # retained post Coreum+Sologenic merger
    address_prefix: "core"
    role: "K9-GL monitoring only — READ ONLY, no execution, no signing"
    lcd_endpoint: "https://full-node.mainnet-1.coreum.dev:1317"
    rpc_endpoint: "https://full-node.mainnet-1.coreum.dev:26657"
    status: "ADDITIVE — surveillance node, does not touch EVM track"

  cosmos_surveillance_layer_testnet:
    chain_name: "tx-testnet"
    chain_id: "coreum-testnet-1"
    address_prefix: "testcore"
    role: "K9-GL testnet validation — same read-only boundary as mainnet"
    lcd_endpoint: "https://full-node.testnet-1.coreum.dev:1317"
    rpc_endpoint: "https://full-node.testnet-1.coreum.dev:26657"
    status: "VERIFIED — LCD responds correctly, test address confirmed valid format (unfunded)"
    test_address: "testcore149mmnnwlck440yl5zpxc3nun8zk9ypp0fldazq"  # Keplr testnet wallet, public only

# ── Identity roles (addresses only — keys never stored here) ────────────────
identities:
  deployer_eoa:
    type: "EVM-Root"
    network: "evm_execution_layer"
    vault_reference: "secret:DEPLOYER_PK"   # Base44 secret, never inline

  ai_session_key:
    type: "EVM-Ephemeral"
    network: "evm_execution_layer"
    vault_reference: "secret:SESSION_KEY_ADDRESS"

  k9_surveillance_node:
    type: "Cosmos-Read-Only"
    network: "cosmos_surveillance_layer"
    vault_reference: "none — public queries only, no signing capability"

# ── Boundary rule ─────────────────────────────────────────────────────────
# The cosmos_surveillance_layer NEVER signs transactions.
# It queries assetft/bank/wasm state only, formats findings as CB-v1
# "observation" envelopes, and forwards to orbitron-bus like any other
# K-9 sensor. Enforces the same rule as Lovable edge functions:
# forward-only, never execute.
