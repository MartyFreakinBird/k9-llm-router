 <!doctype html> <html lang="en"> <head> <meta charset="utf-8" /> <meta name="viewport" content="width=device-width,initial-scale=1" /> <title>K9 Overlay</title> <style> html, body { margin: 0; height: 100%; overflow: hidden; background: #05070a; font-family: Arial, sans-serif; color: #d7e7ff; } #bg { position: fixed; inset: 0; background: radial-gradient(circle at center, #102040 0%, #05070a 70%); } #status { position: absolute; top: 20px; left: 20px; padding: 10px 14px; border: 1px solid #2f5aa8; border-radius: 8px; background: rgba(0,0,0,0.35); backdrop-filter: blur(6px); } </style> </head> <body> <div id="bg"></div> <div id="status"> K9 Wallpaper Ready </div> <script> async function notifyReady() { console.log("WALLPAPER_READY"); try { await fetch("http://127.0.0.1:7200/overlay-ready", { method: "POST" }); console.log("Overlay handshake sent"); } catch (err) { console.log("Overlay handshake failed:", err); } } window.addEventListener("load", notifyReady); </script> </body> </html>
